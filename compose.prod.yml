# Single-VPS production stack (PRD §4.4, Q-1..Q-9). From a clean host with Docker:
#
#   cp .env.prod.example .env.prod   # then edit DOMAIN, ACME_EMAIL, secrets
#   docker compose -f compose.prod.yml build
#   docker compose -f compose.prod.yml up -d
#   docker compose -f compose.prod.yml run --rm migrate      # explicit, never automatic (Q-4)
#   docker compose -f compose.prod.yml run --rm seed         # idempotent bootstrap (O-3)
#   docker compose -f compose.prod.yml up -d --scale api=3   # stateless: scale freely (Decision F)
#   docker compose -f compose.prod.yml run --rm backup-once  # dump now; `backup` does it daily (Q-8)
#   docker compose -f compose.prod.yml run --rm -e CONFIRM_RESTORE=yes restore latest
#
# One origin: Caddy terminates TLS and routes / → web, /v1/* /docs /openapi.json → api (Decisions D, E).
# Valkey is optional (Decision M): `--profile redis`. Everything restarts on crash and on reboot (Q-6).

name: dab-prod

x-logging: &logging
  # JSON logs must never fill a small VPS disk (Q-7)
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

x-app-env: &app-env
  NODE_ENV: production
  DB_DIALECT: ${DB_DIALECT:-mysql}
  DATABASE_URL: ${DATABASE_URL:-mysql://app:${MYSQL_PASSWORD:-app}@mysql:3306/${DATABASE_NAME:-app}}
  TABLE_PREFIX: ${TABLE_PREFIX:-}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  CACHE_DRIVER: ${CACHE_DRIVER:-database}
  RATELIMIT_DRIVER: ${RATELIMIT_DRIVER:-database}
  REDIS_URL: ${REDIS_URL:-}
  LANDING_ROUTE: ${LANDING_ROUTE:-/example}
  # Email bootstrap (J-1): used when the matching mail.* setting is empty; admins can override in Settings
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
  # Public origin(s) the CSRF check accepts (A-10, Decision E): comma-separated, e.g.
  # `https://apps.example.com,https://other.example.id,localhost` (bare host = http and https).
  # The first https entry is used for absolute links in emails. Defaults to https://DOMAIN.
  APP_ORIGIN: ${APP_ORIGIN:-https://${DOMAIN:-localhost}}
  UPLOADS_DIR: /data/uploads

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      # CADDYFILE=./deploy/Caddyfile.behind-proxy when another server on the host terminates TLS (DEPLOY.md §2b)
      - ${CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    <<: *logging

  web:
    build:
      context: .
      target: web
      args:
        DB_DIALECT: '${DB_DIALECT:-mysql}'
        APP_COMMIT: '${APP_COMMIT:-dev}'
        APP_BUILT_AT: '${APP_BUILT_AT:-}'
    image: ${IMAGE_PREFIX:-dab}/web:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      # Deliberately NO fixed ORIGIN: SvelteKit derives each request's origin from
      # X-Forwarded-Proto/Host (set by Caddy, or by the front proxy in DEPLOY.md §2b), so every domain
      # listed in APP_ORIGIN works at once. An empty ORIGIN crashes adapter-node, so pin one only via a
      # compose override (environment: ORIGIN: https://one.example.com), never an empty variable.
      API_URL: http://api:3001
      # SvelteKit trusts the proxy for the client IP / protocol
      ADDRESS_HEADER: X-Forwarded-For
      # How many proxies append to X-Forwarded-For before web: 1 (Caddy only) or 2 (Apache/Nginx → Caddy)
      XFF_DEPTH: ${XFF_DEPTH:-1}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    depends_on:
      api:
        condition: service_healthy
    <<: *logging

  api:
    # No host port and no container_name → `--scale api=N` just works.
    build:
      context: .
      target: api
      args:
        DB_DIALECT: '${DB_DIALECT:-mysql}'
        APP_COMMIT: '${APP_COMMIT:-dev}'
        APP_BUILT_AT: '${APP_BUILT_AT:-}'
    image: ${IMAGE_PREFIX:-dab}/api:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: 3001
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    <<: *logging

  migrate:
    # One-off, explicit (Q-4): `docker compose -f compose.prod.yml run --rm migrate`
    image: ${IMAGE_PREFIX:-dab}/api:${IMAGE_TAG:-local}
    profiles: ['ops']
    environment:
      <<: *app-env
      SCHEDULER_ENABLED: 'false'
    command: ['bun', 'run', '--cwd', 'packages/db', 'migrate']
    depends_on:
      mysql:
        condition: service_healthy
    <<: *logging

  seed:
    # One-off, idempotent (O-3): default tenant, system groups, first superadmin from
    # BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD. Safe to re-run on every deploy.
    image: ${IMAGE_PREFIX:-dab}/api:${IMAGE_TAG:-local}
    profiles: ['ops']
    environment:
      <<: *app-env
      SCHEDULER_ENABLED: 'false'
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ['bun', 'run', '--cwd', 'packages/auth', 'seed']
    depends_on:
      mysql:
        condition: service_healthy
    <<: *logging

  db-init:
    # `run --rm db-init` — idempotent: makes sure DATABASE_NAME exists and user `app` owns it. The mysql
    # image only does this when the volume is FIRST created, so run this after changing DATABASE_NAME
    # (or MYSQL_PASSWORD) on an existing volume, then `migrate` + `seed` as usual.
    image: mysql:8
    profiles: ['ops']
    entrypoint:
      - sh
      - -c
      - >
        MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h mysql -uroot -e
        "CREATE DATABASE IF NOT EXISTS \`$$DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        ALTER USER 'app'@'%' IDENTIFIED BY '$$APP_PASSWORD';
        GRANT ALL PRIVILEGES ON \`$$DB_NAME\`.* TO 'app'@'%'; FLUSH PRIVILEGES;"
        && echo "db-init: database $$DB_NAME siap, user app punya hak penuh"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      APP_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_NAME: ${DATABASE_NAME:-app}
    depends_on:
      mysql:
        condition: service_healthy

  backup:
    # Scheduled logical dumps (O-7, Q-8) into ./backups on the host — copy that folder off-site.
    # BACKUP_IMAGE must carry the client tools of your dialect: mysql:8 (default) or postgres:16.
    image: ${BACKUP_IMAGE:-mysql:8}
    restart: unless-stopped
    entrypoint: ['sh', '/deploy/backup-loop.sh']
    environment:
      DB_DIALECT: ${DB_DIALECT:-mysql}
      DATABASE_URL: ${DATABASE_URL:-mysql://app:${MYSQL_PASSWORD:-app}@mysql:3306/${DATABASE_NAME:-app}}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./deploy:/deploy:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy
    <<: *logging

  backup-once:
    # `run --rm backup-once` — one dump right now (before a migration, before an upgrade).
    image: ${BACKUP_IMAGE:-mysql:8}
    profiles: ['ops']
    entrypoint: ['sh', '/deploy/backup.sh']
    environment:
      DB_DIALECT: ${DB_DIALECT:-mysql}
      DATABASE_URL: ${DATABASE_URL:-mysql://app:${MYSQL_PASSWORD:-app}@mysql:3306/${DATABASE_NAME:-app}}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy:/deploy:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy

  restore:
    # `run --rm restore latest` (or a file name in ./backups). Destructive; asks for CONFIRM_RESTORE=yes:
    #   docker compose --env-file .env.prod -f compose.prod.yml run --rm -e CONFIRM_RESTORE=yes restore latest
    image: ${BACKUP_IMAGE:-mysql:8}
    profiles: ['ops']
    entrypoint: ['sh', '/deploy/restore.sh']
    command: ['latest']
    environment:
      DB_DIALECT: ${DB_DIALECT:-mysql}
      DATABASE_URL: ${DATABASE_URL:-mysql://app:${MYSQL_PASSWORD:-app}@mysql:3306/${DATABASE_NAME:-app}}
      BACKUP_DIR: /backups
    volumes:
      - ./deploy:/deploy:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      # Database name (DATABASE_NAME in .env.prod); applied when the volume is first created, like the passwords.
      MYSQL_DATABASE: ${DATABASE_NAME:-app}
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-change-me-root}']
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *logging

  valkey:
    image: valkey/valkey:8-alpine
    profiles: ['redis']
    restart: unless-stopped
    command: ['valkey-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *logging

volumes:
  caddy-data:
  caddy-config:
  mysql-data:
  valkey-data:
  uploads:
