# Single-VPS production stack (PRD §4.4, Q-1..Q-9). From a clean host with Docker:
#
#   cp .env.prod.example .env.prod   # then edit DOMAIN, ACME_EMAIL, secrets
#   docker compose -f compose.prod.yml build
#   docker compose -f compose.prod.yml up -d
#   docker compose -f compose.prod.yml run --rm migrate      # explicit, never automatic (Q-4)
#   docker compose -f compose.prod.yml run --rm seed         # idempotent bootstrap (O-3)
#   docker compose -f compose.prod.yml run --rm preflight    # readiness checks, exit 0/1 (Q-13)
#   sh deploy/upgrade.sh                                     # new version without downtime (Q-12)
#   docker compose -f compose.prod.yml up -d --scale api=3   # stateless: scale freely (Decision F)
#   docker compose -f compose.prod.yml run --rm backup-once  # dump now; `backup` does it daily (Q-8)
#   docker compose -f compose.prod.yml run --rm -e CONFIRM_RESTORE=yes restore latest
#
# One origin: Caddy terminates TLS and routes / → web, /v1/* /docs /openapi.json → api (Decisions D, E).
# Valkey is optional (Decision M): `--profile redis`. Everything restarts on crash and on reboot (Q-6).
# Every service is capped (Q-14, *_MEM_LIMIT / *_CPUS in .env.prod) so one runaway container cannot
# take the VPS down; the defaults fit a 2 vCPU / 4 GB host with 3 api replicas (§8 #25).

name: dab-prod

x-logging: &logging
  # JSON logs must never fill a small VPS disk (Q-7)
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

x-app-env: &app-env
  NODE_ENV: production
  DB_DIALECT: ${DB_DIALECT:-mysql}
  DATABASE_URL: ${DATABASE_URL:-mysql://app:${MYSQL_PASSWORD:-app}@mysql:3306/${DATABASE_NAME:-app}}
  TABLE_PREFIX: ${TABLE_PREFIX:-}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  CACHE_DRIVER: ${CACHE_DRIVER:-database}
  RATELIMIT_DRIVER: ${RATELIMIT_DRIVER:-database}
  REDIS_URL: ${REDIS_URL:-}
  # One live session per user (A-5): a successful login revokes the account's other sessions
  SINGLE_LOGIN_ENABLE: ${SINGLE_LOGIN_ENABLE:-false}
  LANDING_ROUTE: ${LANDING_ROUTE:-/example}
  # Branding (§4.7): the landing headline, its lead, and the footer line of every page. The
  # first also titles the OpenAPI document. Empty = the translated defaults.
  APP_LANDING_TITLE: ${APP_LANDING_TITLE:-}
  APP_LANDING_LEAD: ${APP_LANDING_LEAD:-}
  APP_FOOTER_TITLE: ${APP_FOOTER_TITLE:-}
  # Email bootstrap (J-1): used when the matching mail.* setting is empty; admins can override in Settings
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-}
  # Public origin(s) the CSRF check accepts (A-10, Decision E): comma-separated, e.g.
  # `https://apps.example.com,https://other.example.id,localhost` (bare host = http and https).
  # The first https entry is used for absolute links in emails. Defaults to https://DOMAIN.
  APP_ORIGIN: ${APP_ORIGIN:-https://${DOMAIN:-localhost}}
  # AI bootstrap (H-2): used when ai.baseurl / ai.key / ai.model are empty in Settings (E-6)
  AI_API_BASE_URL: ${AI_API_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  UPLOADS_DIR: /data/uploads
  # Uploads (Q-16): the `uploads` volume by default, or any S3-compatible bucket
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  S3_VIRTUAL_HOSTED_STYLE: ${S3_VIRTUAL_HOSTED_STYLE:-false}
  # Prometheus (M-6): GET /metrics on the api port — not proxied by Caddy; optional bearer token
  METRICS_ENABLED: ${METRICS_ENABLED:-true}
  METRICS_TOKEN: ${METRICS_TOKEN:-}

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: ${CADDY_MEM_LIMIT:-128m}
    cpus: ${CADDY_CPUS:-0.5}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      # CADDYFILE=./deploy/Caddyfile.behind-proxy when another server on the host terminates TLS (DEPLOY.md §2b)
      - ${CADDYFILE:-./deploy/Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    <<: *logging

  web:
    build:
      context: .
      target: web
      args:
        DB_DIALECT: '${DB_DIALECT:-mysql}'
        APP_COMMIT: '${APP_COMMIT:-dev}'
        APP_BUILT_AT: '${APP_BUILT_AT:-}'
    image: ${IMAGE_PREFIX:-dab}/web:${IMAGE_TAG:-local}
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-384m}
    cpus: ${WEB_CPUS:-1.0}
    # Rollouts (deploy/rollout.sh) stop the old replica with SIGTERM; give in-flight requests time.
    stop_grace_period: 20s
    environment:
      # Deliberately NO fixed ORIGIN: SvelteKit derives each request's origin from
      # X-Forwarded-Proto/Host (set by Caddy, or by the front proxy in DEPLOY.md §2b), so every domain
      # listed in APP_ORIGIN works at once. An empty ORIGIN crashes adapter-node, so pin one only via a
      # compose override (environment: ORIGIN: https://one.example.com), never an empty variable.
      # The same list the api accepts: web checks the Origin of every form post against it (A-10),
      # so a front proxy that drops X-Forwarded-Proto/Host cannot turn every login into a 403.
      APP_ORIGIN: ${APP_ORIGIN:-https://${DOMAIN:-localhost}}
      API_URL: http://api:3001
      # SvelteKit trusts the proxy for the client IP / protocol
      ADDRESS_HEADER: X-Forwarded-For
      # How many proxies append to X-Forwarded-For before web: 1 (Caddy only) or 2 (Apache/Nginx → Caddy)
      XFF_DEPTH: ${XFF_DEPTH:-1}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # Branding and the landing fallback are rendered by web, so it needs them too (§4.7)
      LANDING_ROUTE: ${LANDING_ROUTE:-/example}
      APP_LANDING_TITLE: ${APP_LANDING_TITLE:-}
      APP_LANDING_LEAD: ${APP_LANDING_LEAD:-}
      APP_FOOTER_TITLE: ${APP_FOOTER_TITLE:-}
    depends_on:
      api:
        condition: service_healthy
    <<: *logging

  api:
    # No host port and no container_name → `--scale api=N` just works.
    build:
      context: .
      target: api
      args:
        DB_DIALECT: '${DB_DIALECT:-mysql}'
        APP_COMMIT: '${APP_COMMIT:-dev}'
        APP_BUILT_AT: '${APP_BUILT_AT:-}'
    image: ${IMAGE_PREFIX:-dab}/api:${IMAGE_TAG:-local}
    restart: unless-stopped
    mem_limit: ${API_MEM_LIMIT:-384m}
    cpus: ${API_CPUS:-1.0}
    # serve() finishes in-flight requests and running jobs on SIGTERM before the port closes.
    stop_grace_period: 20s
    environment:
      <<: *app-env
      API_HOST: 0.0.0.0
      API_PORT: 3001
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    <<: *logging

  migrate:
    # One-off, explicit (Q-4): `docker compose -f compose.prod.yml run --rm migrate`
    image: ${IMAGE_PREFIX:-dab}/api:${IMAGE_TAG:-local}
    profiles: ['ops']
    environment:
      <<: *app-env
      SCHEDULER_ENABLED: 'false'
    # The api image is one binary; `migrate` is its subcommand (apps/api/src/cli.ts)
    command: ['migrate']
    depends_on:
      mysql:
        condition: service_healthy
    <<: *logging

  preflight:
    # `run --rm preflight` — read-only readiness checks with actionable messages (Q-13): env complete,
    # no placeholder secrets, database reachable, migrations up to date, seed present, Redis when
    # enabled, uploads volume writable. deploy/upgrade.sh runs it before every rollout.
    image: ${IMAGE_PREFIX:-dab}/api:${IMAGE_TAG:-local}
    profiles: ['ops']
    environment:
      <<: *app-env
      SCHEDULER_ENABLED: 'false'
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ['preflight']
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    <<: *logging

  seed:
    # One-off, idempotent (O-3): default tenant, system groups, first superadmin from
    # BOOTSTRAP_ADMIN_EMAIL / BOOTSTRAP_ADMIN_PASSWORD. Safe to re-run on every deploy.
    image: ${IMAGE_PREFIX:-dab}/api:${IMAGE_TAG:-local}
    profiles: ['ops']
    environment:
      <<: *app-env
      SCHEDULER_ENABLED: 'false'
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    command: ['seed']
    depends_on:
      mysql:
        condition: service_healthy
    <<: *logging

  db-init:
    # `run --rm db-init` — idempotent: makes sure DATABASE_NAME exists and user `app` owns it. The mysql
    # image only does this when the volume is FIRST created, so run this after changing DATABASE_NAME
    # (or MYSQL_PASSWORD) on an existing volume, then `migrate` + `seed` as usual.
    image: mysql:8
    profiles: ['ops']
    entrypoint:
      - sh
      - -c
      - >
        MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -h mysql -uroot -e
        "CREATE DATABASE IF NOT EXISTS \`$$DB_NAME\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
        ALTER USER 'app'@'%' IDENTIFIED BY '$$APP_PASSWORD';
        GRANT ALL PRIVILEGES ON \`$$DB_NAME\`.* TO 'app'@'%'; FLUSH PRIVILEGES;"
        && echo "db-init: database $$DB_NAME siap, user app punya hak penuh"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      APP_PASSWORD: ${MYSQL_PASSWORD:-app}
      DB_NAME: ${DATABASE_NAME:-app}
    depends_on:
      mysql:
        condition: service_healthy

  backup:
    # Scheduled logical dumps (O-7, Q-8) into ./backups on the host — copy that folder off-site.
    # BACKUP_IMAGE must carry the client tools of your dialect: mysql:8 (default) or postgres:16.
    image: ${BACKUP_IMAGE:-mysql:8}
    restart: unless-stopped
    mem_limit: ${BACKUP_MEM_LIMIT:-256m}
    cpus: ${BACKUP_CPUS:-0.5}
    entrypoint: ['sh', '/deploy/backup-loop.sh']
    environment:
      DB_DIALECT: ${DB_DIALECT:-mysql}
      DATABASE_URL: ${DATABASE_URL:-mysql://app:${MYSQL_PASSWORD:-app}@mysql:3306/${DATABASE_NAME:-app}}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./deploy:/deploy:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy
    <<: *logging

  backup-once:
    # `run --rm backup-once` — one dump right now (before a migration, before an upgrade).
    image: ${BACKUP_IMAGE:-mysql:8}
    profiles: ['ops']
    entrypoint: ['sh', '/deploy/backup.sh']
    environment:
      DB_DIALECT: ${DB_DIALECT:-mysql}
      DATABASE_URL: ${DATABASE_URL:-mysql://app:${MYSQL_PASSWORD:-app}@mysql:3306/${DATABASE_NAME:-app}}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy:/deploy:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy

  restore:
    # `run --rm restore latest` (or a file name in ./backups). Destructive; asks for CONFIRM_RESTORE=yes:
    #   docker compose --env-file .env.prod -f compose.prod.yml run --rm -e CONFIRM_RESTORE=yes restore latest
    image: ${BACKUP_IMAGE:-mysql:8}
    profiles: ['ops']
    entrypoint: ['sh', '/deploy/restore.sh']
    command: ['latest']
    environment:
      DB_DIALECT: ${DB_DIALECT:-mysql}
      DATABASE_URL: ${DATABASE_URL:-mysql://app:${MYSQL_PASSWORD:-app}@mysql:3306/${DATABASE_NAME:-app}}
      BACKUP_DIR: /backups
    volumes:
      - ./deploy:/deploy:ro
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    restart: unless-stopped
    mem_limit: ${MYSQL_MEM_LIMIT:-1024m}
    cpus: ${MYSQL_CPUS:-1.5}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      # Database name (DATABASE_NAME in .env.prod); applied when the volume is first created, like the passwords.
      MYSQL_DATABASE: ${DATABASE_NAME:-app}
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-change-me-root}']
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *logging

  valkey:
    image: valkey/valkey:8-alpine
    profiles: ['redis']
    restart: unless-stopped
    mem_limit: ${VALKEY_MEM_LIMIT:-256m}
    cpus: ${VALKEY_CPUS:-0.5}
    command: ['valkey-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    <<: *logging

  # Metrics (M-6): `--profile monitoring` runs Prometheus inside the network, scraping every api
  # replica; UI on 127.0.0.1:9090 only (tunnel with ssh -L 9090:127.0.0.1:9090 <vps>).
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ['monitoring']
    restart: unless-stopped
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-256m}
    cpus: ${PROMETHEUS_CPUS:-0.5}
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}'
      - '--web.listen-address=0.0.0.0:9090'
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    <<: *logging

  # Alertmanager (M-6): receives the rules' alerts from Prometheus; deploy/alertmanager.yml picks the
  # channel (email/Slack/Telegram/webhook). UI on 127.0.0.1:9093 only.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: ['monitoring']
    restart: unless-stopped
    mem_limit: ${ALERTMANAGER_MEM_LIMIT:-128m}
    cpus: ${ALERTMANAGER_CPUS:-0.25}
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=0.0.0.0:9093'
    volumes:
      - ${ALERTMANAGER_CONFIG:-./deploy/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - '127.0.0.1:9093:9093'
    <<: *logging

  # Grafana with the Prometheus datasource and the api dashboard provisioned (deploy/grafana/);
  # UI on 127.0.0.1:3300 only (tunnel: ssh -L 3300:127.0.0.1:3300 <vps>), login admin / GRAFANA_ADMIN_PASSWORD.
  grafana:
    image: grafana/grafana-oss:12.1.1
    profiles: ['monitoring']
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM_LIMIT:-256m}
    cpus: ${GRAFANA_CPUS:-0.5}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-please-now}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SERVER_ROOT_URL: http://127.0.0.1:3300
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3300:3000'
    depends_on:
      - prometheus
    <<: *logging

volumes:
  caddy-data:
  caddy-config:
  mysql-data:
  valkey-data:
  uploads:
  prometheus-data:
  alertmanager-data:
  grafana-data:
