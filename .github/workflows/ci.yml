# CI guards that are switched on at M0 (ROADMAP §6). Each later milestone adds its own job
# here rather than one big check at the end.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck (both dialects) · unit tests · guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: check (modules:sync → db:codegen → biome → typecheck ×2)
        run: bun run check
      - name: unit tests (tanpa .env — seperti mesin baru)
        run: bun run test:unit
      - name: theme contract (L-3, L-5, L-8, L-21)
        run: bun run theme:validate
      - name: DDL states charset & collation explicitly (§4.3)
        run: bun run ci:ddl-guard
      - name: modules:sync never touches tracked core files (G-6, basic)
        run: bun run ci:sync-pure
      - name: penjaga G-6 · bun modgen hanya menyentuh modules/, modules.json, bun.lock, migrasi — dicabut bersih (gate M6 #4)
        run: bun run ci:modgen-guard
      - name: templat `bun create module` sinkron dengan generator (G-12)
        run: bun run ci:starter-check
      - name: gate M5 #4 · tanpa modul AI aplikasi ter-build tanpa jejak AI
        run: bun run proof:m5:gate4
      - name: dependency audit (§8 #7)
        run: bun audit --audit-level=high

  db-matrix:
    name: migrate + smoke · ${{ matrix.dialect }}
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: mysql
            image: mysql:8
            port: 3306
            url: mysql://app:app@127.0.0.1:3306/app
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot
          - dialect: mariadb
            image: mariadb:11
            port: 3306
            url: mysql://app:app@127.0.0.1:3306/app
            health: healthcheck.sh --connect --innodb_initialized
          - dialect: postgres
            image: postgres:16
            port: 5432
            url: postgres://app:app@127.0.0.1:5432/app
            health: pg_isready -h 127.0.0.1 -U app -d app
    services:
      db:
        image: ${{ matrix.image }}
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        # Every image ignores the other images' variables.
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app
          MARIADB_USER: app
          MARIADB_PASSWORD: app
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 40
    env:
      MATRIX_MYSQL_URL: ${{ matrix.url }}
      MATRIX_MARIADB_URL: ${{ matrix.url }}
      MATRIX_POSTGRES_URL: ${{ matrix.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run bootstrap
      - name: codegen → migrate → migrate again → smoke
        run: bun run scripts/db-matrix.ts ${{ matrix.dialect }}

  scheduler-proof:
    name: job terjadwal tepat sekali · 3 instance · MySQL
    runs-on: ubuntu-latest
    needs: check
    services:
      db:
        image: mysql:8
        ports: ['3306:3306']
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 40
    env:
      DB_DIALECT: mysql
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/app
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run bootstrap
      - run: bun run --cwd packages/db migrate
      - name: 3 instances share one database — exactly one run per interval (G-18, D1)
        run: bun run scheduler:proof

  docker-build:
    name: image produksi api + web (Q-2)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - name: build kedua target dari compose.prod.yml
        run: |
          cp .env.prod.example .env.prod
          APP_COMMIT=$GITHUB_SHA APP_BUILT_AT=$(date -u +%FT%TZ) docker compose --env-file .env.prod -f compose.prod.yml build
      - name: ukuran image — Q-2 mewajibkan < 150 MB untuk api dan web
        run: |
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep '^dab/'
          for img in dab/api:local dab/web:local; do
            mb=$(( $(docker image inspect "$img" --format '{{.Size}}') / 1000000 ))
            [ "$mb" -lt 150 ] || { echo "::error::$img = ${mb} MB, melebihi target Q-2 (< 150 MB)"; exit 1; }
          done
      - name: image api = satu binary tanpa bun/node_modules; `version` menjawab
        run: |
          docker run --rm --entrypoint sh dab/api:local -c '! command -v bun >/dev/null && [ ! -d /app/node_modules ] && [ -x /app/api ]'
          docker run --rm -e APP_COMMIT=$GITHUB_SHA dab/api:local version | grep -q "$GITHUB_SHA"
      - name: image api naik, HEALTHCHECK bawaan (`api health`) menjadi healthy, /v1/health menjawab
        run: |
          docker run -d --name api-smoke -e DATABASE_URL=mysql://x:y@127.0.0.1:3306/z -e SCHEDULER_ENABLED=false -p 3001:3001 dab/api:local
          for i in $(seq 1 45); do [ "$(docker inspect -f '{{.State.Health.Status}}' api-smoke)" = healthy ] && break; sleep 1; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' api-smoke)" = healthy ] || { docker logs api-smoke; exit 1; }
          curl -sf http://127.0.0.1:3001/v1/health | grep -q '"status":"ok"'
      - name: image web naik (bundle adapter-node tanpa node_modules) dan menyajikan halaman + aset
        run: |
          docker network create smoke && docker network connect --alias api smoke api-smoke
          docker run -d --name web-smoke --network smoke -e API_URL=http://api:3001 -e ORIGIN=http://127.0.0.1:3000 -p 3000:3000 dab/web:local
          for i in $(seq 1 45); do [ "$(docker inspect -f '{{.State.Health.Status}}' web-smoke)" = healthy ] && break; sleep 1; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' web-smoke)" = healthy ] || { docker logs web-smoke; exit 1; }
          html=$(curl -sf http://127.0.0.1:3000/auth/login)
          asset=$(printf '%s' "$html" | grep -o '/_app/immutable/[^"]*\.js' | head -1)
          [ -n "$asset" ] && curl -sf -o /dev/null "http://127.0.0.1:3000$asset"

  integration:
    name: test integrasi · MySQL + gate M1–M6 via web + modul lintas repo
    runs-on: ubuntu-latest
    needs: check
    services:
      db:
        image: mysql:8
        ports: ['3306:3306']
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 40
    env:
      DB_DIALECT: mysql
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/app
      INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: modul hasil `bun modgen` ikut dimigrasi, di-seed dan diuji (gate M6 #1, PRD §8 #11)
        run: bun run modgen:ci
      - run: bun run bootstrap
      - run: bun run --cwd packages/db migrate
      - run: bun run db:seed
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: bootstrap admin password
      - run: bun test integration
      - name: browser untuk E2E (P-8)
        run: cd apps/web && bunx playwright install --with-deps chromium
      - name: gate M1–M6 lewat web tanpa JavaScript + E2E Playwright (landing → login → CRUD → chat)
        run: sh scripts/ci/m1-proof.sh
        env:
          E2E: '1'
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: bootstrap admin password
      - name: §8 #6 · tidak ada nilai rahasia di bundle klien (web sudah ter-build oleh runner)
        run: SKIP_BUILD=1 bun run ci:bundle-secrets
      - name: cabut modul modgen → pohon kembali bersih
        run: bun run modgen:ci:clean
      - name: gate M6 #2 · modul dari repositori lain (bun create module → harness → modules:add dari URL git → cabut bersih)
        run: bun run ci:cross-repo

  integration-redis:
    name: gate M7 #4 · suite yang sama DENGAN Redis (CACHE_DRIVER=redis, Valkey) + TABLE_PREFIX (O-2)
    runs-on: ubuntu-latest
    needs: check
    services:
      db:
        image: mysql:8
        ports: ['3306:3306']
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 40
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 40
    env:
      DB_DIALECT: mysql
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/app
      CACHE_DRIVER: redis
      REDIS_URL: redis://127.0.0.1:6379
      # O-2: several apps may share one database — every table, index, FK and the journal get the prefix
      TABLE_PREFIX: dab_
      INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run bootstrap
      - run: bun run --cwd packages/db migrate
      - run: bun run db:seed
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: bootstrap admin password
      - run: bun test integration
      - name: konfigurasi runtime lewat cache Redis — gate M1 & M3 lewat web
        run: PROOF_ONLY=M1,M3 sh scripts/ci/m1-proof.sh
        env:
          BOOTSTRAP_ADMIN_EMAIL: admin@example.test
          BOOTSTRAP_ADMIN_PASSWORD: bootstrap admin password
      - name: /v1/ready menyebut Redis saat driver aktif (M-4)
        run: |
          (cd apps/api && API_HOST=127.0.0.1 API_PORT=3002 SCHEDULER_ENABLED=false nohup bun src/index.ts >/tmp/api-redis.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3002/v1/ready && break; sleep 1; done
          curl -s http://127.0.0.1:3002/v1/ready | tee /tmp/ready.json | grep -q '"redis"'

  backup-restore:
    name: §8 #24 · backup → hapus database → restore → aplikasi utuh (O-7, Q-8)
    runs-on: ubuntu-latest
    needs: check
    services:
      db:
        image: mysql:8
        ports: ['3306:3306']
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 40
    env:
      DB_DIALECT: mysql
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/app
      BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      BOOTSTRAP_ADMIN_PASSWORD: bootstrap admin password
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: klien mysql (mysqldump/mysql) — sama seperti image mysql:8 yang dipakai service backup
        run: command -v mysqldump >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client)
      - run: bun install --frozen-lockfile
      - run: bun run bootstrap
      - run: bun run --cwd packages/db migrate
      - run: bun run db:seed
      - run: PROOF_MODE=native sh scripts/ci/backup-restore-proof.sh

  scale-proof:
    name: gate M1 #4 · --scale api=3 tanpa Redis lewat Caddy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: env produksi untuk CI
        run: |
          cp .env.prod.example .env.prod
          sed -i 's/^DOMAIN=.*/DOMAIN=localhost/; s/^HTTP_PORT=.*/HTTP_PORT=18080/; s/^HTTPS_PORT=.*/HTTPS_PORT=18443/' .env.prod
          sed -i 's/^BOOTSTRAP_ADMIN_EMAIL=.*/BOOTSTRAP_ADMIN_EMAIL=admin@example.test/; s/^BOOTSTRAP_ADMIN_PASSWORD=.*/BOOTSTRAP_ADMIN_PASSWORD="bootstrap admin password"/' .env.prod
          # preflight (Q-13) refuses placeholder secrets in production — CI must look like a real install
          sed -i 's/^MYSQL_ROOT_PASSWORD=.*/MYSQL_ROOT_PASSWORD=ci-root-9f3a7c/; s/^MYSQL_PASSWORD=.*/MYSQL_PASSWORD=ci-app-4b8e2d/' .env.prod
      - run: sh scripts/ci/m1-scale-proof.sh
      - name: Q-13 · preflight hijau pada stack yang sudah dimigrasi & di-seed
        run: docker compose --env-file .env.prod -f compose.prod.yml run --rm preflight
      - name: Q-12 · rollout api + web tanpa request gagal
        run: sh scripts/ci/rollout-proof.sh
      - name: §8 #25 · RAM idle seluruh stack (3 replika api) < 1,5 GB
        run: PROJECT=dab-prod SETTLE_SECONDS=20 sh scripts/ci/idle-memory.sh
      - if: always()
        run: test -f .env.prod && docker compose --env-file .env.prod -f compose.prod.yml down -v || true

  lighthouse:
    name: gate M4 #2 · Lighthouse ≥ 90 ×4 di landing (SSR, tanpa JS untuk indeks)
    runs-on: ubuntu-latest
    needs: check
    services:
      db:
        image: mysql:8
        ports: ['3306:3306']
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: app
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 40
    env:
      DB_DIALECT: mysql
      DATABASE_URL: mysql://app:app@127.0.0.1:3306/app
      BOOTSTRAP_ADMIN_EMAIL: admin@example.test
      BOOTSTRAP_ADMIN_PASSWORD: bootstrap admin password
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run bootstrap
      - run: bun run --cwd packages/db migrate
      - run: bun run db:seed
      - name: start api + built web
        run: |
          export API_HOST=127.0.0.1 API_PORT=3001 API_URL=http://127.0.0.1:3001 SCHEDULER_ENABLED=false
          (cd apps/web && bun run build)
          (cd apps/api && nohup bun src/index.ts > /tmp/api.log 2>&1 &)
          (cd apps/web && HOST=127.0.0.1 PORT=5173 ORIGIN=http://127.0.0.1:5173 NODE_ENV=production nohup bun build/index.js > /tmp/web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5173/ >/dev/null && break; sleep 1; done
          curl -sI http://127.0.0.1:5173/ | head -1
      - name: lighthouse (Performance, Accessibility, Best Practices, SEO)
        run: |
          npx --yes lighthouse@12 http://127.0.0.1:5173/ --preset=desktop --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=/tmp/lh.json
          node -e '
            const r = require("/tmp/lh.json").categories;
            const s = Object.fromEntries(Object.entries(r).map(([k,v]) => [k, Math.round(v.score*100)]));
            console.log(JSON.stringify(s));
            const bad = Object.entries(s).filter(([,v]) => v < 90);
            if (bad.length) { console.error("Lighthouse < 90:", bad); process.exit(1); }
          '
      - name: indexable without JavaScript (R-4)
        run: |
          curl -s http://127.0.0.1:5173/ | grep -q 'data-testid="products"'
          curl -s http://127.0.0.1:5173/ | grep -q 'application/ld+json'
      - if: always()
        run: tail -20 /tmp/api.log /tmp/web.log || true
