<!doctype html>
<html lang="%lang%" dir="%dir%" data-app-theme="%theme%" data-mode="%mode%" data-sidebar="%sidebar%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Theme, mode and the sidebar rail (F-8) are decided on the SERVER (hooks.server.ts, PRD L-12)
      and written into the attributes above before the first byte, so the first paint already has
      the right palette, icons and layout. This tiny inline script only refines `system` mode from the OS
      preference before paint; without JavaScript, `system` renders light (L-4).
    -->
    <script>
      (() => {
        var h = document.documentElement;
        if (h.getAttribute('data-mode') === 'system') {
          h.setAttribute('data-mode', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        }
      })();
    </script>
    <!-- Admin-assembled theme (L-24): its tokens are not in the bundle, so they arrive inline here. -->
    %theme_css%
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
