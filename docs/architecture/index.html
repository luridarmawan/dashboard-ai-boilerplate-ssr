<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard AI Boilerplate (SSR) — Architecture</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --line: #e3e6eb;
      --ink: #16181d;
      --muted: #5b6270;
      --accent: #0f766e;
      --accent-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1016;
        --panel: #151a22;
        --line: #262d38;
        --ink: #e8ebf0;
        --muted: #98a1b0;
        --accent: #2dd4bf;
        --accent-ink: #06231f;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 16px;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      width: 100%;
      max-width: 440px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px;
    }
    h1 { margin: 0 0 6px; font-size: 19px; letter-spacing: -0.01em; }
    p { margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }
    a.choice {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
      margin-bottom: 10px;
    }
    a.choice:hover { border-color: var(--accent); }
    a.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    a.primary .note { color: var(--accent-ink); opacity: .78; }
    .name { font-weight: 600; font-size: 14.5px; }
    .note { color: var(--muted); font-size: 12.5px; }
    footer { margin-top: 18px; color: var(--muted); font-size: 12px; }
    footer code { font-size: 11.5px; }
  </style>
</head>
<body>
  <main>
    <h1>Dashboard AI Boilerplate (SSR)</h1>
    <p>Interactive architecture diagram — components, request path, and background work, each node linked to the source file it was read from.</p>

    <a class="choice primary" href="architecture.html" hreflang="en">
      <span class="name">English</span>
      <span class="note">default</span>
    </a>
    <a class="choice" href="architecture.id.html" hreflang="id">
      <span class="name">Bahasa Indonesia</span>
      <span class="note">terjemahan penuh</span>
    </a>

    <footer>Generated with <code>archify</code> from the repository source.</footer>
  </main>
</body>
</html>
