# Prometheus scrape config for the single-VPS stack (PRD M-6). Used by the `monitoring` profile of
# compose.prod.yml; Docker DNS resolves every api replica via `dns_sd_configs`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

# Firing rules go to Alertmanager (same compose profile); deploy/alertmanager.yml decides the channel.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    # Uncomment when METRICS_TOKEN is set in .env.prod (and put the same value here).
    # authorization:
    #   type: Bearer
    #   credentials: change-me-to-METRICS_TOKEN
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 3001
        refresh_interval: 15s
