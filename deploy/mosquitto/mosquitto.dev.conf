# Mosquitto for development (`docker compose --profile mqtt up -d`): open listener on 1883,
# no accounts — the broker is reachable from this machine only (see compose.yml ports).
# Production uses mosquitto.conf next to this file (accounts required).
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
