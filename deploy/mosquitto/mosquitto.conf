# Mosquitto for production (`dc --profile mqtt up -d`): one account, password file generated at
# container start from MQTT_USERNAME / MQTT_PASSWORD (see compose.prod.yml), listener on the
# Docker network only — nothing is published to the host. MQTT 5 clients get shared subscriptions.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/data/passwd
persistence true
persistence_location /mosquitto/data/
# Keep queued QoS 1/2 messages for offline API instances bounded.
max_queued_messages 10000
max_inflight_messages 100
log_dest stdout
log_type error
log_type warning
log_type notice
