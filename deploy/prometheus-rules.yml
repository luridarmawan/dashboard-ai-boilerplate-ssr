# Alerting rules for the api (PRD M-6). Loaded by deploy/prometheus.yml; they show as PENDING/FIRING
# in Prometheus' UI (Alerts tab) and in Grafana. To be paged, point Prometheus at an Alertmanager
# (add `alerting: alertmanagers:` to prometheus.yml) — that part is deliberately left to the operator.
groups:
  - name: crk-api
    rules:
      - alert: ApiInstanceDown
        expr: up{job="api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: 'Replika api {{ $labels.instance }} tidak bisa di-scrape selama 2 menit'
          description: 'Periksa `dc ps` dan `dc logs api`; Caddy sudah mengalihkan traffic ke replika lain.'

      - alert: ApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="api",status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total{job="api"}[5m])), 0.001) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: 'Lebih dari 5% request api berakhir 5xx (5 menit)'
          description: 'Lihat `http_requests_total` per route dan log `unhandled` (requestId) untuk penyebabnya.'

      - alert: ApiSlowP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="api"}[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'Latensi p95 api di atas 1 detik selama 10 menit'
          description: 'Bandingkan per route; cek `db_pool_connections{state="queued"}` dan beban CPU.'

      - alert: DbPoolSaturated
        expr: |
          max by (instance) (db_pool_connections{job="api",state="queued"}) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'Ada request api yang mengantre koneksi database di {{ $labels.instance }}'
          description: 'Pool penuh (`db_pool_max_connections`): kueri lambat atau replika terlalu sedikit untuk beban.'

      - alert: SchedulerJobFailing
        expr: increase(scheduler_job_runs_total{job="api",status="failed"}[1h]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'Job {{ $labels.job }} gagal dalam 1 jam terakhir'
          description: 'Detail di halaman Modul (kesehatan) dan tabel `scheduler_runs`.'

      - alert: ModuleHookFailing
        expr: increase(event_hook_runs_total{job="api",status="failed"}[1h]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: 'Hook modul {{ $labels.module }} gagal pada event {{ $labels.event }}'
          description: 'Kegagalan hook tidak menggagalkan aksi intinya; lihat halaman Modul untuk pesan galatnya.'

      - alert: ApiMemoryNearLimit
        expr: process_resident_memory_bytes{job="api"} > 320 * 1024 * 1024
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'RSS api {{ $labels.instance }} di atas 320 MB (pagu container 384 MB)'
          description: 'Mendekati OOM-kill; naikkan API_MEM_LIMIT atau cari kebocoran (bandingkan replika).'
